# dsh-ltm-gate bundle patch: hard LTM recall gate for the web profile.
# One host row; the row name resolves from the profile's own node_modules
# (installed as a file: dependency).
- insert:
    - id: ltm-gate
      name: 'dsh-ltm-gate'
      config:
        serverName: ltm
        recallTools: [get_recent_memories]
        allowTools: [todo_write, ask_user_question]
        openAfterFailedRecalls: 3
        # slim = short working rules always; the long bootstrap only while the
        # gate is closed. Recall itself is index-first and budgeted.
        prompt: slim
        recallArgs:
          limit: 5
          scope: project
          detail: digest
          snippet_chars: 200
          include_summaries: true   # summaries are the continuity record; digest keeps them cheap
        compactMaxChars: 4000
